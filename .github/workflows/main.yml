name: RDP/Remote Access

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating System'
        required: true
        type: choice
        options:
          - windows
          - macos

jobs:
  windows-rdp:
    runs-on: windows-latest
    if: github.event.inputs.os == 'windows'
    timeout-minutes: 3600
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }

  macos-remote:
    runs-on: macos-latest
    if: github.event.inputs.os == 'macos'
    timeout-minutes: 3600
    steps:
      - name: Install Tailscale
        run: |
          brew install tailscale

      - name: Enable macOS Screen Sharing (VNC)
        run: |
          # Enable screen sharing on the system
          sudo defaults write /var/db/launchd.db/com.apple.launchd.peruser.501.plist -dict-add com.apple.screensharing.server 1
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          
          # Set a simple password (optional)
          VNC_PASS=$(openssl rand -base64 12 | head -c 8)
          echo "VNC_PASSWORD=$VNC_PASS" >> $GITHUB_ENV
          
          sleep 2
          echo "✓ macOS Screen Sharing (native VNC) enabled on port 5900"

      - name: Establish Tailscale Connection
        run: |
          # Start Tailscale daemon
          sudo tailscaled -state=/var/lib/tailscale/tailscaled.state &
          sleep 2
          
          # Authenticate with Tailscale
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-${{ github.run_id }}
          
          # Wait for IP assignment with retry logic
          RETRIES=0
          while [ $RETRIES -lt 15 ]; do
            TAILSCALE_IP=$(tailscale ip -4 2>/dev/null)
            if [ ! -z "$TAILSCALE_IP" ]; then
              break
            fi
            echo "Waiting for Tailscale IP... (attempt $((RETRIES+1))/15)"
            sleep 2
            RETRIES=$((RETRIES + 1))
          done
          
          if [ -z "$TAILSCALE_IP" ]; then
            echo "Error: Tailscale IP not assigned after 30 seconds"
            tailscale status
            exit 1
          fi
          
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
          echo "✓ Tailscale connected: $TAILSCALE_IP"

      - name: Display macOS GUI Access Info
        run: |
          cat << 'EOF'
          
          ╔════════════════════════════════════════════════════════════════╗
          ║         macOS GUI Remote Access (CapStudio Testing)            ║
          ╚════════════════════════════════════════════════════════════════╝
          
          🎯 RECOMMENDED: SSH Tunneling + Screen Sharing
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          
          Step 1 - Create SSH Tunnel (in your terminal):
              ssh -L 5900:localhost:5900 runner@${{ env.TAILSCALE_IP }}
          
          Step 2 - Connect to Screen Sharing:
              • Open "Screen Sharing" app on macOS
              • Or: Finder → Go → Connect to Server
              • Address: localhost:5900
              • Username: runner
              • No password needed (SSH handles auth)
          
          🖥️  Alternative: Direct VNC Connection
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          
          Address:  ${{ env.TAILSCALE_IP }}:5900
          
          Use any VNC Client:
          • macOS: Screen Sharing or Finder → Connect to Server
          • Windows: TightVNC, RealVNC, UltraVNC
          • Linux: Remmina, Vino, TigerVNC Viewer
          
          💻 Direct SSH Access (for CLI testing)
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          
              ssh runner@${{ env.TAILSCALE_IP }}
          
          Then run CapStudio tests directly:
              cd /path/to/capstudio
              npm test  # or your test command
          
          ✅ Platform Support:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          
          This macOS runner supports testing on:
          ✓ macOS (native environment - GUI available now)
          ✓ iOS (via Xcode simulator - accessible via SSH)
          ✓ Cross-platform from any OS
          
          📝 Notes:
          • SSH tunneling is most secure (recommended)
          • Screen Sharing is native macOS VNC protocol
          • Direct VNC works but less secure than SSH tunnel
          
          ⏱️  Connection Active (Auto-expires after 3600 minutes or manual stop)
          ════════════════════════════════════════════════════════════════
          
          EOF

      - name: Keep Connection Active
        run: |
          echo "🟢 macOS runner ready for CapStudio testing"
          echo "Tailscale IP: $(tailscale ip -4)"
          echo ""
          while true; do
            echo "[$(date)] macOS GUI runner active - Connect via SSH tunnel or direct access"
            sleep 300
          done
