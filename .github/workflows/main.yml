name: RDP/Remote Access

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating System'
        required: true
        type: choice
        options:
          - windows
          - macos

jobs:
  windows-rdp:
    runs-on: windows-latest
    if: github.event.inputs.os == 'windows'
    timeout-minutes: 3600
    steps:
      # Your existing RDP steps here...

  macos-remote:
    runs-on: macos-latest
    if: github.event.inputs.os == 'macos'
    timeout-minutes: 3600
    steps:
      - name: Install Tailscale
        run: |
          brew install tailscale
          # Start Tailscale
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-${{ github.run_id }}

      - name: Enable Remote Access (VNC/SSH)
        run: |
          # Enable screen sharing (VNC) or just use SSH
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.RemoteDesktop.plist 2>/dev/null || true
          
          # Get Tailscale IP
          TAILSCALE_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV

      - name: Display Connection Info
        run: |
          echo "=== macOS Remote Access ==="
          echo "SSH: ssh runner@${{ env.TAILSCALE_IP }}"
          echo "VNC: vnc://${{ env.TAILSCALE_IP }}"
          echo "=============================="

      - name: Keep Connection Active
        run: |
          while true; do
            echo "[$(date)] macOS runner active - Use Ctrl+C to terminate"
            sleep 300
          done
